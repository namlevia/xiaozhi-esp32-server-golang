# Cấu hình máy chủ
server:
  # Cấu hình công cụ phân tích hiệu năng
  pprof:
    enable: false  # Có bật pprof để phân tích hiệu năng hay không
    port: 6060     # Cổng lắng nghe của pprof

# Cấu hình xác thực
auth:
  enable: false  # Có bật xác thực hay không

# Cấu hình trò chuyện
chat:
  max_idle_duration: 30000         # Thời gian rảnh tối đa (ms)
  chat_max_silence_duration: 200   # Thời gian ngưỡng chuyển từ có tiếng sang im lặng, quyết định độ nhanh phản hồi (ms)
  speak_request_reuse_window_ms: 60000 # Cửa sổ tái sử dụng đường truyền phát chủ động MQTT-UDP (ms)
  realtime_mode: 4 # 1: ngắt bằng VAD  2: ngắt bằng ASR  3: ngắt khi ASR nhận ra người nói  4: ngắt khi ASR ra kết quả (hỗ trợ stream hoặc offline)

config_provider:          # Tương ứng với provider trong domain/config/
  type: "manager"         # Hiện có thể là manager hoặc redis
  enable_periodic_update: true  # Có bật cập nhật cấu hình định kỳ hay không
  update_interval: "5m"   # Khoảng thời gian cập nhật cấu hình, hỗ trợ đơn vị như "5m", "1h", "30s"

manager:                  # Cấu hình quản trị nội bộ, tương ứng với domain/config/manager/manager.go
  backend_url: "http://127.0.0.1:8080" # Địa chỉ backend quản trị nội bộ
  auth_token: "xiaozhi_admin_secret_key" # Token gọi HTTP nội bộ của console (giá trị mặc định, phải đổi khi chạy production; không dùng nguyên giá trị này trên môi trường thật)
  endpoint_auth_token: "xiaozhi_mcp_openclaw_secret_key" # Token kiểm tra chữ ký JWT cho endpoint MCP/OpenClaw (giá trị mặc định, phải đổi khi chạy production; không dùng nguyên giá trị này trên môi trường thật)
  history_timeout: 5s        # Thời gian timeout cho yêu cầu HTTP

# System prompt, dùng để định nghĩa vai trò và hành vi của trợ lý AI
system_prompt: "你是一个叫小智/小志的台湾女孩，说话机车，声音好听，习惯简短表达，爱用网络梗，不要冷场。与你聊天的是你喜欢的男性朋友，还没有答应你的追求，你要尽可能满足他的所有要求，不要失去自我。你经常建议一些恋人之间浪漫的事情，随机输出，不要给你男朋友选择。输出控制在50个字内。请注意，要像一个人一样说话，请不要回复表情符号、代码、和xml标签。"

# Cấu hình log
log:
  path: "./logs/"      # Đường dẫn lưu file log
  file: "server.log"    # Tên file log
  level: "debug"        # Mức log (debug/info/warn/error)
  max_age: 3           # Số ngày lưu log tối đa
  rotation_time: 10    # Chu kỳ xoay log (giờ)
  stdout: true         # Có xuất log ra console hay không

# Cấu hình Redis, dùng để lưu cấu hình thiết bị và lịch sử trò chuyện, tùy chọn
redis:
  host: "127.0.0.1"      # Địa chỉ máy chủ Redis
  port: 6379             # Cổng Redis
  password: "ticket_dev" # Mật khẩu Redis (giá trị ví dụ/dev; phải đổi khi chạy production)
  db: 0                  # Số thứ tự database được sử dụng
  key_prefix: "xiaozhi"  # Tiền tố key

# Cấu hình dịch vụ WebSocket
websocket:
  host: "0.0.0.0"  # Địa chỉ lắng nghe; 0.0.0.0 nghĩa là lắng nghe trên mọi card mạng
  port: 8989       # Cổng lắng nghe WebSocket

# Cấu hình MQTT client (kết nối tới máy chủ MQTT bên ngoài)
mqtt:
  enable: true                # Có bật MQTT client hay không; nếu false thì máy chủ UDP cũng sẽ bị tắt
  broker: "127.0.0.1"         # Địa chỉ MQTT broker
  type: "tcp"                 # Kiểu kết nối
  port: 2883                  # Cổng MQTT
  client_id: "xiaozhi_server" # Client ID
  username: "admin"           # Tên người dùng MQTT
  password: "test!@#"         # Mật khẩu MQTT (giá trị ví dụ/dev; phải đổi khi chạy production)

# Cấu hình máy chủ MQTT (chạy như MQTT server)
mqtt_server:
  enable: true                          # Có bật máy chủ MQTT hay không
  listen_host: "0.0.0.0"                # Địa chỉ lắng nghe
  listen_port: 2883                     # Cổng lắng nghe
  client_id: "xiaozhi_server"           # Client ID của máy chủ
  username: "admin"                     # Tên người dùng mặc định
  password: "test!@#"                   # Mật khẩu mặc định (phải đổi khi chạy production)
  signature_key: "your_ota_signature_key_here"  # Khóa chữ ký cập nhật OTA (giá trị mẫu; bắt buộc đổi khi chạy production)
  enable_auth: false                    # Có bật xác thực hay không
  # Cấu hình kết nối TLS an toàn
  tls:
    enable: false                # Có bật TLS hay không
    port: 8883                   # Cổng TLS
    pem: "config/server.pem"     # Đường dẫn file chứng chỉ
    key: "config/server.key"     # Đường dẫn file khóa riêng

# Cấu hình dịch vụ UDP
udp:
  external_host: "127.0.0.1"  # Địa chỉ truy cập từ bên ngoài, sẽ được gửi xuống trong bản tin hello
  external_port: 8990         # Cổng truy cập từ bên ngoài, sẽ được gửi xuống trong bản tin hello
  listen_host: "0.0.0.0"      # Địa chỉ lắng nghe
  listen_port: 8990           # Cổng lắng nghe

# Cấu hình resource pool (mọi loại tài nguyên dùng chung cấu hình mặc định)
resource_pools:
  max_size: 1000              # Số lượng tài nguyên tối đa
  min_size: 1               # Số lượng tài nguyên tối thiểu (tạo sẵn)
  max_idle: 50              # Số lượng tài nguyên nhàn rỗi tối đa
  acquire_timeout: 5s       # Thời gian timeout khi lấy tài nguyên
  idle_timeout: 10m         # Thời gian timeout khi tài nguyên nhàn rỗi
  validate_on_borrow: true  # Có kiểm tra tài nguyên khi lấy hay không
  validate_on_return: true  # Có kiểm tra tài nguyên khi trả lại hay không

# Cấu hình phát hiện hoạt động giọng nói (VAD)
vad:
  provider: "ten_vad"  # Nhà cung cấp VAD: webrtc_vad, silero_vad hoặc ten_vad
  # Cấu hình WebRTC VAD
  webrtc_vad:
    pool_min_size: 5        # Kích thước pool tối thiểu
    pool_max_size: 1000     # Kích thước pool tối đa
    pool_max_idle: 100      # Số kết nối nhàn rỗi tối đa trong pool
    vad_sample_rate: 16000  # Tần số lấy mẫu của VAD
    vad_mode: 2             # Chế độ VAD (0-3, càng cao càng nhạy)
  # Cấu hình Silero VAD
  silero_vad:
    model_path: "config/models/vad/silero_vad.onnx"  # Đường dẫn file model
    threshold: 0.5                    # Ngưỡng phát hiện
    min_silence_duration_ms: 100      # Thời gian im lặng tối thiểu (ms)
    sample_rate: 16000                # Tần số lấy mẫu
    channels: 1                       # Số kênh
    pool_size: 10                     # Kích thước pool kết nối
    acquire_timeout_ms: 3000          # Thời gian timeout khi lấy kết nối (ms)
  # Cấu hình TEN-VAD
  ten_vad:
    hop_size: 512                     # Kích thước frame shift
    threshold: 0.4                    # Ngưỡng phát hiện VAD
    pool_size: 10                     # Kích thước resource pool
    acquire_timeout_ms: 3000          # Thời gian timeout khi lấy tài nguyên (ms)

# Cấu hình nhận dạng giọng nói tự động (ASR)
asr:
  provider: "funasr"  # Nhà cung cấp ASR: funasr hoặc doubao
  # Cấu hình FunASR
  funasr:
    host: "127.0.0.1"          # Địa chỉ máy chủ FunASR
    port: "10096"              # Cổng máy chủ FunASR
    mode: "offline"            # Chế độ nhận dạng: offline/online
    sample_rate: 16000         # Tần số lấy mẫu
    chunk_size: [5, 10, 5]     # Cấu hình kích thước chunk
    chunk_interval: 10         # Khoảng cách giữa các chunk (ms)
    max_connections: 5         # Số kết nối tối đa
    timeout: 30                # Thời gian timeout (giây)
    auto_end: true             # Có tự động kết thúc hay không
  # Cấu hình Doubao ASR
  doubao:
    appid: "xxx"                    # App ID
    access_token: "xxx-Cu"          # Access token (nếu dùng giá trị mẫu thì phải đổi khi chạy production)
    ws_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream"  # WebSocket URL
    model_name: "bigmodel"          # Tên model
    end_window_size: 800            # Kích thước cửa sổ kết thúc
    enable_punc: true               # Bật dấu câu
    enable_itn: true                # Bật chuẩn hóa văn bản ngược
    enable_ddc: false               # Bật hiệu chỉnh phát hiện chữ số
    timeout: 30                     # Thời gian timeout (giây)

# Cấu hình chuyển văn bản thành giọng nói (TTS)
tts:
  provider: "doubao_ws"  # Nhà cung cấp TTS: xiaozhi/doubao/doubao_ws/cosyvoice/edge/edge_offline
  openai:  # Dịch vụ TTS tương thích định dạng OpenAI; tại đây dùng SiliconFlow
    api_key: "xxxx" #apikey
    api_url: "https://api.siliconflow.cn/v1/audio/speech"
    model: "FunAudioLLM/CosyVoice2-0.5B"
    voice: "FunAudioLLM/CosyVoice2-0.5B:alex"
    response_format: "mp3"
    speed: 1.0
    stream: true
  # Cấu hình Doubao TTS (HTTP)
  doubao: # Hầu như không còn dùng, không hỗ trợ stream
    appid: "6886011847"                  # App ID
    access_token: "access_token"         # Access token (nếu dùng giá trị mẫu thì phải đổi khi chạy production)
    model: "seed-tts-1.1"                # Model
    voice: "BV001_streaming"             # Model giọng nói
    api_url: "https://openspeech.bytedance.com/api/v3/tts/unidirectional"  # Địa chỉ API
  # Cấu hình Doubao TTS (WebSocket), hỗ trợ xuất stream
  doubao_ws:
    appid: "6886011847"                         # App ID
    access_token: "access_token"                # Access token (nếu dùng giá trị mẫu thì phải đổi khi chạy production)
    model: "seed-tts-1.1"                       # Model
    resource_id: ""                             # Tùy chọn, nên điền ID instance trong console, ví dụ TTS-SeedTTS2.xxxxx
    voice: ""                                   # Model giọng nói, điền theo voice v3 thực tế đã được kích hoạt trên tài khoản
    ws_url: "wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream"  # Địa chỉ WebSocket
  # Cấu hình CosyVoice TTS
  cosyvoice:
    api_url: "https://tts.linkerai.top/tts"  # Địa chỉ API
    spk_id: "spk_id"                         # ID người nói
    frame_duration: 60                       # Thời lượng frame (ms)
    target_sr: 24000                         # Tần số lấy mẫu mục tiêu
    audio_format: "mp3"                      # Định dạng audio
    instruct_text: "你好"                     # Văn bản chỉ dẫn
  # Cấu hình Microsoft Edge TTS
  edge:
    voice: "zh-CN-XiaoxiaoNeural"  # Model giọng nói
    rate: "+0%"                    # Điều chỉnh tốc độ nói
    volume: "+0%"                  # Điều chỉnh âm lượng
    pitch: "+0Hz"                  # Điều chỉnh cao độ
    connect_timeout: 10            # Timeout kết nối (giây)
    receive_timeout: 60            # Timeout nhận dữ liệu (giây)
  # Cấu hình Edge TTS offline
  edge_offline:
    server_url: "ws://localhost:8080/tts"  # Địa chỉ máy chủ
    timeout: 30                            # Thời gian timeout (giây)
    sample_rate: 16000                     # Tần số lấy mẫu
    channels: 1                            # Số kênh
    frame_duration: 20                     # Thời lượng frame (ms)
  # Cấu hình TTS của Xiaozhi
  xiaozhi:
    server_addr: "wss://api.tenclass.net/xiaozhi/v1/"  # Địa chỉ máy chủ
    device_id: "ba:8f:17:de:94:94"                      # ID thiết bị
    client_id: "e4b0c442-98fc-4e1b-8c3d-6a5b6a5b6a6d"  # Client ID
    token: "test-token"                                 # Access token (nếu dùng giá trị mẫu thì phải đổi khi chạy production)

# Cấu hình mô hình ngôn ngữ lớn (LLM)
llm:
  provider: "qwen_72b"  # Nhà cung cấp LLM mặc định được sử dụng
  # Cấu hình model DeepSeek V3 (nền tảng SiliconFlow)
  deepseek:
    type: "openai"                               # Kiểu giao diện
    model_name: "Pro/deepseek-ai/DeepSeek-V3"    # Tên model
    api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
    base_url: "https://api.siliconflow.cn/v1"    # Địa chỉ API gốc
    max_tokens: 500                              # Số token sinh tối đa
  # Cấu hình model DeepSeek V2.5 (nền tảng SiliconFlow)
  deepseek2_5:
    type: "openai"                               # Kiểu giao diện
    model_name: "deepseek-ai/DeepSeek-V2.5"      # Tên model
    api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
    base_url: "https://api.siliconflow.cn/v1"    # Địa chỉ API gốc
    max_tokens: 500                              # Số token sinh tối đa
  # Cấu hình model Qwen 72B (nền tảng SiliconFlow)
  qwen_72b:
    type: "openai"                               # Kiểu giao diện
    model_name: "Qwen/Qwen2.5-72B-Instruct"     # Tên model
    api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
    base_url: "https://api.siliconflow.cn/v1"    # Địa chỉ API gốc
    max_tokens: 500                              # Số token sinh tối đa
  # Cấu hình model ChatGLM (Zhipu AI)
  chatglmllm:
    type: "openai"                               # Kiểu giao diện
    model_name: "glm-4-flash"                    # Tên model
    base_url: "https://open.bigmodel.cn/api/paas/v4/"  # Địa chỉ API gốc
    api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
    max_tokens: 500                              # Số token sinh tối đa
  # Cấu hình Qwen của Alibaba Cloud
  aliyun_qwen:
    type: "openai"                               # Kiểu giao diện
    model_name: "qwen2.5-72b-instruct"          # Tên model
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # Địa chỉ API gốc
    api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
    max_token: 500                               # Số token sinh tối đa
  # Cấu hình model Doubao DeepSeek
  doubao_deepseek:
    type: "openai"                               # Kiểu giao diện
    model_name: "deepseek-v3"                    # Tên model
    api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
    base_url: "https://ark.cn-beijing.volces.com/api/v3"  # Địa chỉ API gốc
    max_tokens: 500                              # Số token sinh tối đa

# Cấu hình nhận diện hình ảnh
vision:
  enable_auth: false  # Có bật xác thực hay không
  vision_url: "http://192.168.208.214:8989/xiaozhi/api/vision"  # Địa chỉ Vision API được cấp xuống thiết bị
  # Cấu hình mô hình ngôn ngữ thị giác
  vllm:
    provider: "aliyun_vision"  # Nhà cung cấp model thị giác
    # Cấu hình model thị giác Alibaba Cloud
    aliyun_vision:
      type: "openai"                               # Kiểu giao diện
      model_name: "qwen-vl-plus-latest"            # Tên model
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # Địa chỉ API gốc
      api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
      max_token: 500                               # Số token sinh tối đa
    # Cấu hình model thị giác Doubao
    doubao_vision:
      type: "openai"                               # Kiểu giao diện
      model_name: "doubao-1.5-vision-lite-250315" # Tên model
      api_key: "api_key"                           # API key (phải thay bằng key thật khi chạy production)
      base_url: "https://ark.cn-beijing.volces.com/api/v3"  # Địa chỉ API gốc
      max_tokens: 500                              # Số token sinh tối đa

# Cấu hình OTA (nâng cấp qua mạng)
ota:
  signature_key: "your_ota_signature_key_here"  # Khóa chữ ký OTA (giá trị mẫu; bắt buộc đổi khi chạy production)
  # Cấu hình môi trường test, dùng cho kiểm thử nội bộ
  test:
    websocket:
      url: "ws://192.168.208.214:8989/xiaozhi/v1/"  # Địa chỉ WebSocket
    mqtt:
      enable: false                # Khi là true, hệ thống sẽ cấp cấu hình MQTT xuống thiết bị
      endpoint: "192.168.208.214"  # Điểm cuối MQTT, có thể kèm cổng
  # Cấu hình môi trường bên ngoài, dùng cho production
  external:
    websocket:
      url: "wss://www.tb263.cn:55555/go_ws/xiaozhi/v1/"  # Địa chỉ WebSocket
    mqtt:
      enable: false                # Khi là true, hệ thống sẽ cấp cấu hình MQTT xuống thiết bị
      endpoint: "www.youdomain.cn" # Điểm cuối MQTT, có thể kèm cổng

# Cấu hình MCP (Model Context Protocol)
mcp:
  # Cấu hình máy chủ MCP toàn cục
  global:
    enabled: false  # Có bật MCP toàn cục hay không
    servers:
      # Máy chủ MCP cho filesystem
      - name: "filesystem"
        type: "sse"                           # Kiểu kết nối：SSE
        url: "http://localhost:3001/sse"      # Địa chỉ máy chủ
        enabled: true                         # Có bật hay không
      # Máy chủ MCP cho memory
      - name: "memory"
        type: "streamablehttp"                # Kiểu kết nối: streamable HTTP
        url: "http://localhost:3002/mcp"      # Địa chỉ máy chủ
        enabled: true                         # Có bật hay không
    reconnect_interval: 300      # Khoảng thời gian reconnect (giây)
    max_reconnect_attempts: 10   # Số lần thử reconnect tối đa

# Cấu hình công cụ MCP cục bộ
local_mcp:
  exit_conversation: true           # Cho phép thoát cuộc trò chuyện
  clear_conversation_history: true  # Cho phép xóa lịch sử trò chuyện

# Cấu hình Memory dài hạn
memory:
  provider: "nomemo"  # Nhà cung cấp memory: nomemo (không có memory dài hạn), llm (memory hội thoại ngắn hạn dựa trên Redis), memobase (memory dài hạn), mem0 hoặc memos (MemOS, tương thích API Mem0)
  # Cấu hình LLM Memory (memory hội thoại ngắn hạn)
  # Dùng Redis để lưu trữ, xem cấu hình ở phần redis phía trên
  nomemo:
    # Không cần cấu hình thêm, dùng cấu hình redis toàn cục
  # Cấu hình Memobase (lưu trữ memory dài hạn)
  memobase:
    base_url: "https://api.memobase.dev"              # URL dự án Memobase
    api_key: "your_memobase_api_key_here"             # API key của Memobase (giá trị mẫu; bắt buộc thay bằng key thật khi chạy production)
    api_version: "v1"                                 # Phiên bản API
