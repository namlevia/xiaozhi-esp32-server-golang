version: '3.8'

services:
  # Dịch vụ database MySQL
  mysql:
    image: mysql:8.0
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xiaozhi_admin
    ports:
      - "23306:3306"        # Có thể không cần map cổng
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "3306", "-u", "root", "-ppassword", "-e", "SELECT 1"]
      timeout: 5s
      retries: 3
      interval: 10s
      start_period: 180s

  # Dịch vụ chương trình chính, bản build local
  main-server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.main
      args:
        TARGETARCH: amd64
    platform: linux/amd64
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml", "-tts-enable", "-tts-config", "/workspace/tts_server.json"]
    ports:
      - "18989:8989"       # Cổng WebSocket service
      - "19001:9001"       # Cổng TTS local
      - "12883:2883"       # mqtt server
      - "18888:8888/udp"   # udp server
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
      - ../../build/common/tts_server.json:/workspace/tts_server.json:ro
      - ../../tts_server/tts-model:/workspace/tts-model
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ ASR tiếng Việt Go, bản build local
  voice-server:
    build:
      context: ../../asr_server
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: xiaozhi-voice-server
    ports:
      - "18082:9000"       # Cổng ASR tiếng Việt Go
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ backend quản trị, bản build local
  backend:
    build:
      context: ../../manager/backend
      dockerfile: Dockerfile
    container_name: xiaozhi-backend
    ports:
      - "28080:8080"       # Map cổng backend quản trị ra host
    depends_on:
      mysql:
        condition: service_healthy
      voice-server:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../manager/backend/config:/root/config
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ frontend quản trị, bản build local
  frontend:
    build:
      context: ../../manager/frontend
      dockerfile: Dockerfile
    container_name: xiaozhi-frontend
    ports:
      - "18080:80"          # Map cổng frontend quản trị ra host
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  xiaozhi-network:
    driver: bridge