version: '3.8'

services:
  # Dịch vụ database MySQL
  mysql:
    image: mysql:8.0
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xiaozhi_admin
    ports:
      - "23306:3306"        # Có thể không cần map cổng
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "3306", "-u", "root", "-ppassword", "-e", "SELECT 1"]
      timeout: 5s
      retries: 3
      interval: 10s
      start_period: 180s

  # Dịch vụ chương trình chính
  main-server:
    image: ghcr.io/hackers365/xiaozhi_server:0.6.0
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml", "-tts-enable", "-tts-config", "/workspace/tts_server.json"]
    ports:
      - "8989:8989"        # Cổng WebSocket service
      - "9001:9001"        # Cổng TTS local
      - "2883:2883"        # mqtt server 12883
      - "8888:8888/udp"     # udp server 8888
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
      - ../../build/common/tts_server.json:/workspace/tts_server.json:ro
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ backend quản trị
  backend:
    image: ghcr.io/hackers365/xiaozhi_manager_backend:0.6.0
    container_name: xiaozhi-backend
    ports:
      - "8081:8080"        # Map cổng backend quản trị ra host
    depends_on:
      mysql:
        condition: service_healthy
      voice-server:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - AUDIO_BASE_PATH=/data/chat_history/audio
      - SPEAKER_SERVICE_URL=http://voice-server:8080
    volumes:
      - ../../manager/backend/config:/root/config
      - backend_audio_data:/data/chat_history/audio
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ frontend quản trị
  frontend:
    image: ghcr.io/hackers365/xiaozhi_manager_frontend:0.6.0
    container_name: xiaozhi-frontend
    ports:
      - "8080:80"           # Map cổng frontend quản trị ra host
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ database vector Qdrant dùng cho nhận diện người nói
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"         # Cổng REST API
      - "6334:6334"         # Cổng gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ ASR tiếng Việt Go-native
  voice-server:
    build:
      context: ../../asr_server
      dockerfile: Dockerfile
    image: xiaozhi-voice-server-go
    container_name: xiaozhi-voice-server
    ports:
      - "8082:9000"
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  mysql_data:
  backend_audio_data:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
