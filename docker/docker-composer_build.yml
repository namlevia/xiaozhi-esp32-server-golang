version: '3.8'

services:
  # Dịch vụ database MySQL
  mysql:
    image: docker.jsdelivr.fyi/mysql:8.0
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xiaozhi_admin
    ports:
      - "23306:3306"        # Có thể không cần map cổng
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  # Dịch vụ chương trình chính
  main-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml", "-tts-enable", "-tts-config", "/workspace/tts_server.json"]
    ports:
      - "18989:8989"
      - "19001:9001"
      - "12883:2883"
    depends_on:
      - mysql
      - backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
    volumes:
      - ../config:/workspace/config
      - ../logs:/workspace/logs
      - ../build/common/tts_server.json:/workspace/tts_server.json:ro
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ backend quản trị
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: xiaozhi-backend
    ports:
      - "28080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
    volumes:
      - ../manager/backend/config:/root/config
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Dịch vụ frontend quản trị
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: xiaozhi-frontend
    ports:
      - "18080:80"
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  voice-server:
    build:
      context: ../asr_server
      dockerfile: Dockerfile
    image: xiaozhi-voice-server-go
    container_name: xiaozhi-voice-server
    ports:
      - "8082:9000"
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
