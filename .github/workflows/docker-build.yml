name: Build và push Docker image
on:
  push:
    tags: ["v*"]  # Chạy khi push tag dạng v1.0.0
  workflow_dispatch:  # Cho phép chạy thủ công
jobs:
  build-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Kiểm tra submodule asr_server
        run: |
          if [ ! -f asr_server/server/setup.go ]; then
            echo "::error::Chưa kéo submodule asr_server, hãy kiểm tra checkout đã dùng submodules: recursive"
            ls -la asr_server 2>/dev/null || true
            exit 1
          fi
          echo "Submodule asr_server đã sẵn sàng"
      - name: Thiết lập QEMU
        uses: docker/setup-qemu-action@v3
      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Tạo metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xiaozhi_server
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
      - name: Build và push main-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.main
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
  build-golang:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Tạo metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xiaozhi_golang
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
      - name: Build và push image golang runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
  build-golang-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Tạo metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xiaozhi_golang_build
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
      - name: Build và push image golang build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile_build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Thiết lập QEMU
        uses: docker/setup-qemu-action@v3
      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Tạo metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xiaozhi_manager_frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
      - name: Build và push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Thiết lập QEMU
        uses: docker/setup-qemu-action@v3
      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Tạo metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xiaozhi_manager_backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
      - name: Build và push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
