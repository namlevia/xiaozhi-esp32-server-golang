name: Android ARM64 build test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build-test.yml"
      - "cmd/**"
      - "internal/**"
      - "manager/frontend/**"
      - "build/common/**"
      - "doc/aio/README_android.md"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kiểm tra submodule asr_server
        run: |
          if [ ! -f asr_server/server/setup.go ]; then
            echo "::error::Chưa kéo submodule asr_server, build binary cần voice_server"
            ls -la asr_server 2>/dev/null || true
            exit 1
          fi

      - name: Thiết lập Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"

      - name: Thiết lập Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build frontend để embed UI
        run: |
          cd manager/frontend && npm ci && npm run build
          mkdir -p ../backend/static/dist
          cp -r dist/* ../backend/static/dist/

      - name: Build binary Android ARM64 Lite
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          if [ ! -x "$CC" ]; then
            echo "::error::Không tìm thấy Android NDK clang: $CC"
            exit 1
          fi
          go build -v -tags "nolibopusfile manager embed_ui" \
            -ldflags "-s -w" \
            -o xiaozhi_server ./cmd/server

      - name: Đóng gói artifact Android ARM64 Lite
        run: |
          PACK_DIR="out/android-arm64-lite/xiaozhi_server-android-arm64-lite"
          mkdir -p "$PACK_DIR/logs" "$PACK_DIR/data" "$PACK_DIR/storage"
          cp xiaozhi_server "$PACK_DIR/"
          cp build/common/main_config.yaml build/common/manager.json build/common/asr_server.json "$PACK_DIR/"
          cp build/common/tts_server_aio.json "$PACK_DIR/tts_server.json"
          cp doc/aio/README_android.md "$PACK_DIR/README.md"
          cp -r build/common/models "$PACK_DIR/"
          cp -r build/common/data/* "$PACK_DIR/data/"
          rm -f "$PACK_DIR/data/xiaozhi.db"
          chmod +x "$PACK_DIR/xiaozhi_server"

      - name: Upload artifact Android ARM64 Lite
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_server-android-arm64-lite-test
          path: out/android-arm64-lite
